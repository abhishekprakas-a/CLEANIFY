name: Deploy Next.js App to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Update to match your Next.js project's Node version

      - name: Create .env file for Build & Server
        run: |
          echo "AUTH_COOKIE_NAME=${{ secrets.AUTH_COOKIE_NAME }}" >> .env
          echo "AUTH_REFRESH_COOKIE_NAME=${{ secrets.AUTH_REFRESH_COOKIE_NAME }}" >> .env
          echo "JWT_ACCESS_EXPIRES_IN=${{ secrets.JWT_ACCESS_EXPIRES_IN }}" >> .env
          echo "JWT_REFRESH_EXPIRES_IN_DAYS=${{ secrets.JWT_REFRESH_EXPIRES_IN_DAYS }}" >> .env
          echo "JWT_REFRESH_REMEMBER_DAYS=${{ secrets.JWT_REFRESH_REMEMBER_DAYS }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "MONGODB_DB_NAME=${{ secrets.MONGODB_DB_NAME }}" >> .env
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env
          echo "NEXT_PUBLIC_APP_NAME=${{ secrets.NEXT_PUBLIC_APP_NAME }}" >> .env
          echo "NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}" >> .env
          echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> .env
          echo "PASSWORD_RESET_EXPIRES_MINUTES=${{ secrets.PASSWORD_RESET_EXPIRES_MINUTES }}" >> .env
          echo "S3_BUCKET=${{ secrets.S3_BUCKET }}" >> .env
          echo "S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}" >> .env
          echo "S3_FORCE_PATH_STYLE=${{ secrets.S3_FORCE_PATH_STYLE }}" >> .env
          echo "S3_PRESIGNED_EXPIRES_SECONDS=${{ secrets.S3_PRESIGNED_EXPIRES_SECONDS }}" >> .env
          echo "S3_PUBLIC_BASE_URL=${{ secrets.S3_PUBLIC_BASE_URL }}" >> .env
          echo "S3_REGION=${{ secrets.S3_REGION }}" >> .env
          echo "SEED_ADMIN_EMAIL=${{ secrets.SEED_ADMIN_EMAIL }}" >> .env
          echo "SEED_ADMIN_NAME=${{ secrets.SEED_ADMIN_NAME }}" >> .env
          echo "SEED_ADMIN_PASSWORD=${{ secrets.SEED_ADMIN_PASSWORD }}" >> .env
          echo "SEED_ADMIN_PHONE=${{ secrets.SEED_ADMIN_PHONE }}" >> .env
          echo "VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}" >> .env

      - name: Install Dependencies
        run: npm ci # Uses package-lock.json for a clean install

      - name: Build Next.js Application
        run: npm run build

      - name: Copy Build Artifacts & .env to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_KEY }}
          source: ".next,.env"
          target: "/sites/CLEANIFY"
          # This copies the .next folder and .env file directly into /sites/CLEANIFY/

      - name: Execute Server-side Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_KEY }}
          script: |
            cd /sites/CLEANIFY
            
            # Pull latest code
            git pull origin main
            
            # Install dependencies on the server
            npm i
            
            # Restart the application using PM2
            pm2 restart cleanify

